<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Farmacia de Raza</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-container"><div class="logo-badge"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/></svg></div><div class="logo"><h2>FarmaciaDeRaza</h2></div></a>
        <nav class="nav-links"><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="nosotros.html">Nosotros</a><a href="blogs.html">Salud &amp; Blog</a><a href="registro.html">Crear Cuenta</a></nav>
        <a href="carrito.html" class="cart-status"><span>Mi Carrito</span><span class="cart-badge" id="cart-count">0</span></a>
    </header>
    <main class="container">
        <section class="content-section">
            <h1>Contáctanos</h1>
            <p>Déjanos tu consulta y te responderemos a la brevedad.</p>
            <form id="form-contacto" class="simple-form" novalidate>
                <label for="contacto-nombre">Nombre completo</label>
                <input id="contacto-nombre" name="nombre" type="text" autocomplete="name" maxlength="100" required>
                <label for="contacto-correo">Correo electrónico</label>
                <input id="contacto-correo" name="correo" type="email" autocomplete="email" maxlength="100" required>
                <label for="contacto-comentario">Comentario</label>
                <textarea id="contacto-comentario" name="comentario" maxlength="500" required></textarea>
                <button class="btn-submit" type="submit">Enviar consulta</button>
                <p id="contacto-feedback" class="form-feedback" role="status"></p>
            </form>
        </section>
    </main>
    <footer><div class="footer-bottom"><p>&copy; 2026 Farmacia de Raza.</p><a href="index.html">Volver al inicio</a></div></footer>
    <script src="js/main.js"></script>
</body>
</html>
