<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h2>MiTienda</h2></div>
        <nav class="nav-links"><a href="index.html">Volver a Home</a></nav>
    </header>

    <main class="container">
        <h2>Registro de Usuario</h2>
        <form id="form-registro" novalidate>
            <div class="form-group">
                <label for="run">RUN (Sin puntos ni guión, ej: 19011022K)*</label>
                <input type="text" id="run" required maxlength="9">
                <small class="error-msg" id="error-run"></small>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre*</label>
                <input type="text" id="nombre" required maxlength="50">
                <small class="error-msg" id="error-nombre"></small>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos*</label>
                <input type="text" id="apellidos" required maxlength="100">
                <small class="error-msg" id="error-apellidos"></small>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico (@duoc.cl, @profesor.duoc.cl, @gmail.com)*</label>
                <input type="email" id="correo" required maxlength="100">
                <small class="error-msg" id="error-correo"></small>
            </div>

            <div class="form-group">
                <label for="region">Región*</label>
                <select id="region" required>
                    <option value="">-- Seleccione una Región --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comuna">Comuna*</label>
                <select id="comuna" required disabled>
                    <option value="">-- Seleccione una Comuna --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección*</label>
                <input type="text" id="direccion" required maxlength="300">
                <small class="error-msg" id="error-direccion"></small>
            </div>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
