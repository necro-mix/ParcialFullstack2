<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Portal Farmacia de Raza</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo-container">
            <div class="logo-badge">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/></svg>
            </div>
            <div class="logo">
                <h2>FarmaciaDeRaza</h2>
            </div>
        </a>
        <nav class="nav-links">
            <a href="index.html">Volver al Inicio</a>
            <a href="login.html" id="nav-login">Iniciar Sesión</a>
            <a href="admin.html" class="admin-link" id="admin-link" style="display: none;">Panel Admin</a>
            <button id="nav-logout" onclick="logout()" style="display: none;">Cerrar Sesión</button>
        </nav>
    </header>

    <main class="container">
        <section class="form-card">
            <div class="form-header">
                <h2>Registro de Cuenta Paciente</h2>
                <p>Completa el formulario para habilitar tus compras y acceder a convenios.</p>
            </div>

            <form id="form-registro" novalidate class="form-grid">
                <div class="form-group">
                    <label for="run">RUN (sin puntos ni guión)*</label>
                    <input type="text" id="run" required maxlength="9" autocomplete="off" placeholder="19011022K">
                    <small class="error-msg" id="error-run"></small>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico*</label>
                    <input type="email" id="correo" required maxlength="100" autocomplete="email" placeholder="usuario@duoc.cl">
                    <small class="error-msg" id="error-correo"></small>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre*</label>
                    <input type="text" id="nombre" required maxlength="50" autocomplete="given-name" placeholder="Juan">
                    <small class="error-msg" id="error-nombre"></small>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos*</label>
                    <input type="text" id="apellidos" required maxlength="100" autocomplete="family-name" placeholder="Pérez González">
                    <small class="error-msg" id="error-apellidos"></small>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña*</label>
                    <input type="password" id="contrasena" name="contrasena" required minlength="4" maxlength="10" autocomplete="new-password" placeholder="4 a 10 caracteres">
                    <button type="button" class="toggle-password" id="mostrar-contrasena" aria-controls="contrasena" aria-pressed="false">Mostrar contraseña</button>
                    <small class="error-msg" id="error-contrasena"></small>
                </div>

                <div class="form-group">
                    <label for="confirmar-contrasena">Repetir contraseña*</label>
                    <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required minlength="4" maxlength="10" autocomplete="new-password" placeholder="Repite tu contraseña">
                    <small class="error-msg" id="error-confirmar-contrasena"></small>
                </div>

                <div class="form-group">
                    <label for="region">Región Domiciliaria*</label>
                    <select id="region" autocomplete="address-level1" required>
                        <option value="">-- Seleccione una Región --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comuna">Comuna Domiciliaria*</label>
                    <select id="comuna" autocomplete="address-level2" required disabled>
                        <option value="">-- Seleccione una Comuna --</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="direccion">Dirección Calle y Número*</label>
                    <input type="text" id="direccion" required maxlength="300" autocomplete="street-address" placeholder="Av. Providencia 1234, Depto 502">
                    <small class="error-msg" id="error-direccion"></small>
                </div>

                <button type="submit" class="btn-submit">Confirmar y Crear Cuenta</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 UnaFarmaciaPeroDeRazaRaaaaza. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
