<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="backdrop"></div>

    <header class="brand">
        <span>Acceso</span>
    </header>

    <main class="auth-wrap">
        <div class="auth-card">
            <h1 class="auth-title">Iniciar sesión</h1>
            <p class="auth-subtitle">Ingresa tus datos para continuar con tu cuenta.</p>

            <form novalidate>
                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                    <p class="field-error">Ingresa un correo válido.</p>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <p class="field-error">La contraseña es obligatoria.</p>
                </div>

                <div class="row-between">
                    <span class="checkbox-row">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordarme</label>
                    </span>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-play btn-full">Iniciar sesión</button>

                <div class="divider">o</div>

                <button type="button" class="btn btn-info btn-full">Continuar como invitado</button>
            </form>

            <p class="auth-footer">
                ¿No tienes cuenta? <a href="#">Regístrate</a>
            </p>
        </div>
    </main>

</body>
</html>
